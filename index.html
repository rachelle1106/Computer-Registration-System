<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Registration System</title>
</head>
<body>
    <h1>Computer Registration System</h1>
    <h2>Register a Computer</h2>

    <form>
        <label>Computer ID:</label>
        <input type="text" required>
        <br><br>

        <label>Computer Brand:</label>
        <input type="text" required>
        <br><br>

        <label>Computer Model:</label>
        <input type="text" required>
        <br><br>

        <label>Location:</label>
        <input type="text" required>
        <br><br>

        <button type="submit">Register Computer</button>
    </form>
</body>
</html>
